# FTPS gateway for plug-and-play cameras.
#
# One-time setup (see gateway/README.md):
#   fly launch --no-deploy --copy-config --name phc-ftp
#   fly ips allocate-v4            # dedicated IPv4: raw TCP needs one
#   fly secrets set PASV_URL=<that IPv4>
#   fly deploy
#   fly scale count 1              # passive data connections must reach the
#                                  # same machine as the control connection

app = "phc-ftp"
primary_region = "iad"

[env]
  FTP_PORT = "21"
  PASV_MIN = "30000"
  PASV_MAX = "30009"
  REQUIRE_TLS = "true"
  GATEWAY_HOSTNAME = "phc-ftp.fly.dev"

# FTP control channel.
[[services]]
  protocol = "tcp"
  internal_port = 21
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 21

  [[services.tcp_checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

# Passive data ports. With a port range, each external port maps to the same
# internal port number.
[[services]]
  protocol = "tcp"
  internal_port = 30000
  auto_stop_machines = "off"

  [[services.ports]]
    start_port = 30000
    end_port = 30009

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
