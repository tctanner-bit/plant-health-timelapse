# FTPS gateway for plug-and-play cameras.
#
# Setup and redeploy steps: gateway/README.md

app = "phc-ftp"
primary_region = "iad"

[env]
  FTP_PORT = "21"
  PASV_MIN = "30000"
  PASV_MAX = "30009"
  REQUIRE_TLS = "true"
  GATEWAY_HOSTNAME = "phc-ftp.fly.dev"

# FTP control channel.
[[services]]
  protocol = "tcp"
  internal_port = 21
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 21

  [[services.tcp_checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

# Passive data ports, one service each. Fly forwards a port range to a single
# internal_port, but the gateway tells each camera an exact port to dial, so
# every external port must land on the same internal port number.
[[services]]
  protocol = "tcp"
  internal_port = 30000
  auto_stop_machines = "off"
  [[services.ports]]
    port = 30000

[[services]]
  protocol = "tcp"
  internal_port = 30001
  auto_stop_machines = "off"
  [[services.ports]]
    port = 30001

[[services]]
  protocol = "tcp"
  internal_port = 30002
  auto_stop_machines = "off"
  [[services.ports]]
    port = 30002

[[services]]
  protocol = "tcp"
